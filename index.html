<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critical Care Companion</title>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critical Care">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#14161a;--mut:#69707d;--line:#e3e6eb;--soft:#eef0f3;
  --brand:#0f2742;--brand2:#1d4f7f;--accent:#e2483d;
  --ok:#1f8a4c;--okbg:#e3f4ea;--bad:#c2302b;--badbg:#fbe5e3;--amb:#b7791f;--ambbg:#fdf1d8;
  --dq:#3C3489;--dqbg:#EEEDFE;--dqln:#AFA9EC;
  --ac:#085041;--acbg:#E1F5EE;--acln:#5DCAA5;
  --en:#E1F5EE;--enbg:#0F6E56;
  --fl:#712B13;--flbg:#FAECE7;--flln:#F0997B;
  --cs:#0C447C;--csbg:#E6F1FB;
  --sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1117;--card:#161b23;--ink:#e8ebf0;--mut:#9aa3b2;--line:#283040;--soft:#1e2531;
  --brand:#0b1d33;--brand2:#173a5f;
  --okbg:#173a26;--badbg:#3f1c1a;--ambbg:#3c2f12;
  --dq:#CECBF6;--dqbg:#24204a;--dqln:#534AB7;
  --ac:#9FE1CB;--acbg:#0c332b;--acln:#0F6E56;
  --fl:#F5C4B3;--flbg:#43190b;--flln:#993C1D;
  --cs:#B5D4F4;--csbg:#0f2a47;--sh:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.bar.top{border-bottom-color:transparent}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bar .back{border:0;background:var(--soft);font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.bar .logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#ff6b5e;display:flex;align-items:center;justify-content:center}
.bar .meta{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:6px;font-weight:600}
.big{font-size:22px;font-weight:750;margin:2px 0;letter-spacing:-.01em}
.mut{color:var(--mut)}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:650;background:var(--brand);color:#fff;text-align:center;text-decoration:none;box-shadow:var(--sh)}
@media (prefers-color-scheme:dark){.btn{background:#2a64a0}}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.hard{margin-top:8px;background:linear-gradient(135deg,#c2302b,#e2483d);color:#fff}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px}.row .btn{margin:0}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:18px;color:#fff;background:linear-gradient(140deg,#0f2742 0%,#1d4f7f 60%,#2b6aa6 100%);box-shadow:0 10px 30px rgba(15,39,66,.25)}
.hero .ecg{position:absolute;left:0;right:0;bottom:6px;width:100%;height:46px;color:rgba(255,120,110,.35);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-k{font-size:13px;opacity:.75;font-weight:600;letter-spacing:.02em}
.hero-t{font-size:21px;font-weight:750;letter-spacing:-.01em;margin-top:2px}
.hero-ring svg text{fill:#fff}
.hero-ring svg circle:first-child{stroke:rgba(255,255,255,.2)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.hero-stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px}
.hero-stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:11.5px;opacity:.8}
.hero-btn{position:relative;z-index:1;display:block;background:#fff;color:#0f2742;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 14px;font-size:15px}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:18px 4px 10px;letter-spacing:.01em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:138px;box-shadow:var(--sh);transition:transform .12s}
.tile:active{transform:scale(.98)}
.ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:4px}
.ti.sm{width:30px;height:30px;border-radius:9px;margin:0;box-shadow:none}
.tile .tn{font-weight:700;font-size:15px;line-height:1.25;letter-spacing:-.01em}
.tile .ts{font-size:12px;color:var(--mut)}
.tile .due{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 7px}
.tbar,.pbar{display:block;height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:auto}
.tbar i,.pbar i{display:block;height:100%;background:var(--c);border-radius:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:11px;color:var(--mut);padding:4px 0;border-radius:12px}
.tabs a.on{color:var(--ink);font-weight:700}
.tabs a.on svg{color:var(--accent)}
/* pathway hub */
.phero{display:flex;gap:14px;align-items:center;border-radius:22px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 85%,#000) 0%,var(--c) 100%);box-shadow:0 10px 26px color-mix(in srgb,var(--c) 30%,transparent)}
.phero-i{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.phero-t{font-size:19px;font-weight:750;letter-spacing:-.01em}
.phero-b{font-size:13px;opacity:.88;line-height:1.4;margin-top:3px}
.phero svg text{fill:#fff}.phero svg circle:first-child{stroke:rgba(255,255,255,.25)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.modes a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;text-decoration:none;box-shadow:var(--sh)}
.modes b{display:block;font-size:15px}.modes span{font-size:11.5px;color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut)}
/* progress */
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mut)}
.days i{width:100%;aspect-ratio:1;border-radius:6px;background:var(--soft)}
.days .on i{background:var(--accent)}
.prow{display:grid;grid-template-columns:30px 90px 1fr 42px;gap:10px;align-items:center;padding:8px 0;text-decoration:none;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pbar{margin:0}.prow b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.pn{font-weight:600;font-size:14px}
.wrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);text-decoration:none}
.wrow small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.wdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
/* tree */
.n{border-radius:16px;padding:11px 14px;font-size:15px;line-height:1.35;text-align:center;animation:pop .35s ease-out;position:relative;cursor:pointer;box-shadow:var(--sh)}
.n small{display:block;font-size:12.5px;opacity:.85;margin-top:3px}
.n .i{position:absolute;right:9px;top:7px;font-size:11px;opacity:.6}
.n.dq{background:var(--dqbg);color:var(--dq);border:1px solid var(--dqln)}
.n.ac{background:var(--acbg);color:var(--ac);border:1px solid var(--acln)}
.n.dx{background:var(--csbg);color:var(--cs);border:1px solid var(--cs);font-weight:700}
.n.en{background:linear-gradient(140deg,#0b5a47,#0f6e56);color:var(--en);font-weight:650}
.n.hid{background:var(--soft);color:var(--mut);border:1px dashed var(--line);font-size:22px;font-weight:700;box-shadow:none}
.n .notes{display:none;text-align:left;font-size:13.5px;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid currentColor;font-weight:400}
.n.open .notes{display:block}
.notes b{display:block;margin-top:4px}
.ln{width:2px;height:18px;background:var(--line);margin:0 auto}
.fork{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.fork button{min-width:96px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);padding:11px 18px;font-size:15px;font-weight:650;box-shadow:var(--sh)}
.fork button.ok{background:var(--okbg);border-color:var(--ok)}
.fork button.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.ghost{font-size:12.5px;color:var(--mut);border:1px dashed var(--line);border-radius:12px;padding:6px 10px;text-align:center;margin:8px auto 0;max-width:86%;animation:pop .35s}
.case{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:18px;padding:15px;margin-bottom:6px;box-shadow:var(--sh)}
.case .who{font-weight:750;font-size:17px;letter-spacing:-.01em}
.case .hx{font-size:15px;line-height:1.5;margin:5px 0}
.case .obs{font-size:13px;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:9px;padding:6px 9px;display:inline-block}
.case .inv{font-size:14px;margin-top:6px;background:var(--soft);border-radius:8px;padding:7px 9px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;animation:pop .3s;box-shadow:var(--sh)}
.ask .q{font-weight:650;margin-bottom:8px;font-size:15px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;font-size:15px;margin-top:7px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:14px;line-height:1.5;margin-top:10px;padding:11px 12px;border-radius:12px;background:var(--soft)}
.twist{background:var(--flbg);color:var(--fl);border:1px solid var(--flln);border-radius:16px;padding:13px;margin-top:12px;animation:pop .35s}
.twist .lbl{color:var(--fl)}
.res{background:var(--csbg);color:var(--cs);border:1px solid var(--cs);border-radius:16px;padding:11px 13px;margin-top:10px;font-size:14.5px;line-height:1.5;animation:pop .35s}.res .lbl{color:var(--cs)}
.sci{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.sci b{flex:none}
.sci.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sci.miss{background:var(--ambbg);border:1.5px dashed var(--amb)}
.sci.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.reveal{margin-top:18px}
.n small.pend{font-style:italic;opacity:.6}
.ask.mech{border:1.5px solid var(--dqln);background:var(--dqbg)}.ask.mech .lbl{color:var(--dq)}
.crumbs{font-size:12.5px;color:var(--mut);line-height:1.7;margin-bottom:10px}
.crumbs span{background:var(--soft);border-radius:6px;padding:1px 6px;margin:0 2px}
/* map */
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px;-webkit-overflow-scrolling:touch}
.mcol{display:flex;flex-direction:column;align-items:center;min-width:max-content}
.mfork{display:flex;align-items:flex-start;min-width:max-content}
.mbr{display:flex;flex-direction:column;align-items:center;padding:0 6px;position:relative;min-width:118px;flex:1 0 auto}
.mbr::before{content:"";position:absolute;top:0;left:0;right:0;border-top:2px solid var(--line)}
.mbr:first-child::before{left:50%}.mbr:last-child::before{right:50%}
.mlab{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.mn{font-size:12.5px;padding:7px 9px;border-radius:10px;max-width:150px;animation:none;cursor:pointer}
.mn small{font-size:11px}
.mn.st-good{box-shadow:0 0 0 3px var(--ok)}
.mn.st-ok{box-shadow:0 0 0 3px var(--amb)}
.mn.st-weak{box-shadow:0 0 0 3px var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.detail{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:12px}
.zoom{display:flex;gap:6px;margin-bottom:8px}
.zoom button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-size:14px}
/* content blocks */
.ref{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid currentColor;border-radius:8px;padding:3px 8px;opacity:.9}
.dg{margin-top:10px}.notes .dg{background:var(--card);border-radius:10px;padding:8px;color:var(--ink)}
.dg svg{display:block;max-width:420px;margin:0 auto}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:15px;line-height:1.4}
.ml{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.wt{width:100%;border-collapse:collapse;font-size:13.5px}.wt td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}.wt td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.wt.news{font-size:11.5px;table-layout:fixed}.wt.news td{text-align:center;font-weight:500;padding:5px 1px;white-space:normal}.wt.news td:first-child{text-align:left;font-weight:700}
.wt.news tr:first-child td{font-weight:800}
.wtf{font-size:13px;margin-top:8px;line-height:1.45}
.ladder div,.signs div{border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:13.5px;line-height:1.45}
.ladder b,.signs b{display:block;font-size:14px}
.signs div{background:var(--soft)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tli{position:relative;padding:5px 0;font-size:14px;line-height:1.35}
.tli .dot{position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.tli b{margin-right:6px}.tli span{color:var(--mut)}
.hts details{background:var(--soft);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px;line-height:1.45}
.hts summary{font-weight:700;cursor:pointer}
.hts details div{margin-top:6px}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main id="main"></main>
<script src="pathways/acs.js"></script>
<script src="pathways/pe.js"></script>
<script src="pathways/dvt.js"></script>
<script src="pathways/als.js"></script>
<script src="pathways/asthma.js"></script>
<script src="pathways/anaph.js"></script>
<script src="pathways/sepsis.js"></script>
<script src="pathways/whys.js"></script>
<script src="pathways/mech.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){let _r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_r)return;_r=true;location.reload()});window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}</script>
</body>
</html>
