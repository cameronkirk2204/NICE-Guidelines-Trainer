<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathways</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pathways">
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e2e0da;--soft:#efede7;
  --ok:#1f8a4c;--okbg:#e3f4ea;--bad:#c2302b;--badbg:#fbe5e3;--amb:#b7791f;--ambbg:#fdf1d8;
  --dq:#3C3489;--dqbg:#EEEDFE;--dqln:#AFA9EC;
  --ac:#085041;--acbg:#E1F5EE;--acln:#5DCAA5;
  --en:#E1F5EE;--enbg:#0F6E56;
  --fl:#712B13;--flbg:#FAECE7;--flln:#F0997B;
  --cs:#0C447C;--csbg:#E6F1FB;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141416;--card:#1f1f23;--ink:#ececef;--mut:#9a9aa2;--line:#33333a;--soft:#2a2a30;
  --okbg:#173a26;--badbg:#3f1c1a;--ambbg:#3c2f12;
  --dq:#CECBF6;--dqbg:#2a2650;--dqln:#534AB7;
  --ac:#9FE1CB;--acbg:#0d3a30;--acln:#0F6E56;
  --en:#E1F5EE;--enbg:#0F6E56;
  --fl:#F5C4B3;--flbg:#4A1B0C;--flln:#993C1D;
  --cs:#B5D4F4;--csbg:#0f2c4a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:inherit}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{border:0;background:none;font-size:26px;line-height:1;padding:0 6px 2px 0}
.bar .meta{font-size:13px;color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:4px}
.big{font-size:22px;font-weight:700;margin:2px 0}
.mut{color:var(--mut)}
.note{font-size:13px;color:var(--mut);line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px}.row .btn{margin:0}
/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:128px;position:relative}
.tile .tn{font-weight:700;font-size:15px;line-height:1.25}
.tile .ts{font-size:12px;color:var(--mut)}
.tile.soon{opacity:.5}
.tile .ring{position:absolute;right:12px;top:12px}
.tile .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;align-self:flex-start;color:#fff}
/* tree */
.n{border-radius:14px;padding:10px 13px;font-size:15px;line-height:1.35;text-align:center;animation:pop .35s ease-out;position:relative;cursor:pointer}
.n small{display:block;font-size:12.5px;opacity:.85;margin-top:3px}
.n .i{position:absolute;right:8px;top:6px;font-size:11px;opacity:.6}
.n.dq{background:var(--dqbg);color:var(--dq);border:1px solid var(--dqln)}
.n.ac{background:var(--acbg);color:var(--ac);border:1px solid var(--acln)}
.n.dx{background:var(--csbg);color:var(--cs);border:1px solid var(--cs);font-weight:700}
.n.en{background:var(--enbg);color:var(--en);font-weight:600}
.n.hid{background:var(--soft);color:var(--mut);border:1px dashed var(--line);font-size:22px;font-weight:700}
.n .notes{display:none;text-align:left;font-size:13.5px;line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px solid currentColor;font-weight:400}
.n.open .notes{display:block}
.notes b{display:block;margin-top:4px}
.ln{width:2px;height:16px;background:var(--line);margin:0 auto}
.fork{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.fork button{min-width:84px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;font-size:15px;font-weight:600}
.fork button.ok{background:var(--okbg);border-color:var(--ok)}
.fork button.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.ghost{font-size:12.5px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:5px 9px;text-align:center;margin:8px auto 0;max-width:86%;animation:pop .35s}
.case{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:6px}
.case .who{font-weight:700;font-size:16px}
.case .hx{font-size:15px;line-height:1.45;margin:4px 0}
.case .obs{font-size:13px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
.case .inv{font-size:14px;margin-top:6px;background:var(--soft);border-radius:8px;padding:7px 9px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;animation:pop .3s}
.ask .q{font-weight:600;margin-bottom:8px;font-size:15px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 12px;font-size:15px;margin-top:6px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:14px;line-height:1.45;margin-top:10px;padding:10px;border-radius:10px;background:var(--soft)}
.twist{background:var(--flbg);color:var(--fl);border:1px solid var(--flln);border-radius:14px;padding:12px;margin-top:12px;animation:pop .35s}
.twist .lbl{color:var(--fl)}
.reveal{margin-top:16px}
.crumbs{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:10px}
.crumbs span{background:var(--soft);border-radius:6px;padding:1px 6px;margin:0 2px;white-space:nowrap}
/* map */
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;-webkit-overflow-scrolling:touch}
.mcol{display:flex;flex-direction:column;align-items:center;min-width:max-content}
.mfork{display:flex;align-items:flex-start;min-width:max-content}
.mbr{display:flex;flex-direction:column;align-items:center;padding:0 6px;position:relative;min-width:118px;flex:1 0 auto}
.mbr::before{content:"";position:absolute;top:0;left:0;right:0;border-top:2px solid var(--line)}
.mbr:first-child::before{left:50%}.mbr:last-child::before{right:50%}
.mlab{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.mn{font-size:12.5px;padding:7px 9px;border-radius:10px;max-width:150px;animation:none;cursor:pointer}
.mn small{font-size:11px}
.mn.st-good{box-shadow:0 0 0 3px var(--ok)}
.mn.st-ok{box-shadow:0 0 0 3px var(--amb)}
.mn.st-weak{box-shadow:0 0 0 3px var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.detail{position:sticky;bottom:0;margin-top:12px}
.zoom{display:flex;gap:6px;margin-bottom:8px}
.zoom button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--soft);border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11.5px;color:var(--mut)}
.ref{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid currentColor;border-radius:8px;padding:3px 8px;opacity:.9}
.dg{margin-top:10px}.notes .dg{background:var(--card);border-radius:10px;padding:8px;color:var(--ink)}
.dg svg{display:block;max-width:420px;margin:0 auto}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:15px;line-height:1.4}
.ml{flex:none;width:28px;height:28px;border-radius:8px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.wt{width:100%;border-collapse:collapse;font-size:13.5px}.wt td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}.wt td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.wtf{font-size:13px;margin-top:8px;line-height:1.45}
.ladder div,.signs div{border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:13.5px;line-height:1.4}
.ladder b,.signs b{display:block;font-size:14px}
.signs div{background:var(--soft)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main id="main"></main>
<script src="pathways/acs.js"></script>
<script src="pathways/pe.js"></script>
<script src="pathways/dvt.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
