<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Critical Care">
<title>Antibiotics · Critical Care Companion</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e2e0da;
  --gp:#3a5fc8;--gnb:#b0161b;--gnc:#7b3f8c;--an:#6b5200;--at:#6b6b6b;
  --ok:#1f8a4c;--okbg:#e3f4ea;--bad:#c2302b;--badbg:#fbe5e3;--miss:#b7791f;--missbg:#fdf1d8;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141416;--card:#1f1f23;--ink:#ececef;--mut:#9a9aa2;--line:#33333a;
  --okbg:#173a26;--badbg:#3f1c1a;--missbg:#3c2f12}
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;max-width:760px;margin:0 auto}
.top h1{font-size:17px;margin:0}
.score{font-size:13px;color:var(--mut)}
nav{display:flex;gap:4px;padding:6px 10px 8px;max-width:760px;margin:0 auto;overflow-x:auto}
nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 6px;border-radius:9px;font-size:14px;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.q-title{font-size:24px;font-weight:700;margin:4px 0 2px}
.q-sub{font-size:14px;color:var(--mut)}
.group{margin-top:12px}
.ghead{font-size:12px;font-weight:700;color:#fff;padding:4px 8px;border-radius:6px 6px 0 0;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 13px;font-size:15px;font-style:italic;min-height:42px}
.chip.drug{font-style:normal}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.chip.ok::before{content:"✓ ";color:var(--ok);font-style:normal}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink);text-decoration:line-through}
.chip.miss{background:var(--missbg);border-color:var(--miss);border-style:dashed;color:var(--ink)}
.chip.miss::before{content:"+ ";color:var(--miss);font-style:normal}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.why{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);font-size:15px;line-height:1.45;display:none}
.why b{display:block;margin-bottom:4px}
.verdict{font-weight:700;font-size:16px;margin-top:12px}
.legend{font-size:12px;color:var(--mut);margin-top:8px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.rule h3{margin:0 0 6px;font-size:16px}
.rule p{margin:6px 0;font-size:15px;line-height:1.5}
.rule .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;margin-right:4px;vertical-align:1px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:0}
th.drug,td.drug{position:sticky;left:0;background:var(--card);text-align:left;padding:6px 8px;white-space:nowrap;font-weight:600;z-index:1;border-right:1px solid var(--line)}
thead th{padding:4px 2px;color:#fff;font-weight:600;font-size:10.5px;min-width:40px}
td.c{width:40px;height:30px;text-align:center}
td.c.y{background:var(--cc)}
td.c.y::after{content:"●";color:#fff;font-size:10px}
.hide td.c.y{background:transparent}
.hide td.c.y::after{content:""}
.hide td.c.y.rev{background:var(--cc)}
.hide td.c.y.rev::after{content:"●"}
.hide td.c.rev:not(.y)::after{content:"·";color:var(--mut)}
td.cls{font-size:10px;color:var(--mut);font-weight:400;display:block}
.toggle{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px}
.note{font-size:13px;color:var(--mut);line-height:1.45}
svg text{font-family:inherit}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.filter button{font-size:13px;padding:6px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filter button.on{background:var(--ink);color:var(--bg)}

/* chart v2 */
.ab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 4px}
.abhead,.abrow{display:grid;grid-template-columns:1fr;gap:3px}
@media (min-width:620px){.abhead,.abrow{grid-template-columns:180px 1fr;column-gap:12px;align-items:center}}
.abhead{position:sticky;top:calc(92px + env(safe-area-inset-top));background:var(--card);z-index:3;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.gband{color:#fff;font-size:10px;font-weight:700;text-align:center;padding:3px 0;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blab{font-size:10px;text-align:center;color:var(--mut);font-style:italic;writing-mode:vertical-rl;transform:rotate(180deg);height:76px;display:flex;align-items:center;justify-content:flex-start;margin:0 auto;white-space:nowrap}
.clhead{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.clhead .dot{width:10px;height:10px;border-radius:3px}
.clhead em{white-space:nowrap;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.abrow{padding:5px 0;border-radius:8px;cursor:pointer}
.abrow:active{background:var(--bg)}
.abname{font-size:14px;font-weight:600;line-height:1.2}
.abname small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.track{position:relative;height:22px}
.track .cell{grid-row:1;border-radius:4px;height:22px}
.track .seg{grid-row:1;height:22px;border-radius:11px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);transition:background .2s}
.blank .seg{background:transparent!important;box-shadow:none;border:1.5px dashed var(--line)}
.blank .abrow.rev .seg{background:var(--sc)!important;border:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.abwhy{display:none;grid-column:1/-1;font-size:14px;line-height:1.45;background:var(--bg);border-radius:8px;padding:9px 11px;margin-top:4px}
.abrow.open .abwhy{display:block}
/* classes */
.stem{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
.cls-card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cls-card h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cls-card p{margin:5px 0;font-size:15px;line-height:1.5}
.cls-card .eg{font-size:13px;color:var(--mut)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 8px;font-size:14px;text-align:left;display:flex;gap:7px;align-items:center}
.opt .dot{width:10px;height:10px;border-radius:3px;flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="top"><h1><a href="./" aria-label="Back to home" style="color:inherit;text-decoration:none;margin-right:8px">‹</a>Antibiotics</h1><div class="score" id="score"></div></div>
  <nav>
    <button data-v="drug" class="on">Drug → bugs</button>
    <button data-v="bug">Bug → drugs</button>
    <button data-v="rules">Rules</button>
    <button data-v="classes">Classes</button>
    <button data-v="chart">Chart</button>
  </nav>
</header>
<main id="main"></main>

<script>
const GROUPS=[
 {name:"Gram +ve cocci",s:"GP cocci",col:"var(--gp)",bugs:["mrsa","mssa","strep"]},
 {name:"Gram −ve bacilli",s:"GN bacilli",col:"var(--gnb)",bugs:["ecoli","pmir","kleb","pseud","escappm"]},
 {name:"Gram −ve cocci",s:"GN cocci",col:"var(--gnc)",bugs:["ngon","nmen"]},
 {name:"Anaerobes",s:"Ana",col:"var(--an)",bugs:["anaer"]},
 {name:"Atypicals",s:"Atyp",col:"var(--at)",bugs:["atyp"]},
];
const BUG={mrsa:"MRSA",mssa:"MSSA",strep:"Streptococci",ecoli:"E. coli",pmir:"P. mirabilis",kleb:"Klebsiella",pseud:"Pseudomonas",escappm:"ESCAPPM",ngon:"N. gonorrhoeae",nmen:"N. meningitidis",anaer:"Anaerobes",atyp:"Atypicals"};
const SHORT={mrsa:"MRSA",mssa:"MSSA",strep:"Strep",ecoli:"E.coli",pmir:"Prot",kleb:"Kleb",pseud:"Pseud",escappm:"ESC",ngon:"N.gon",nmen:"N.men",anaer:"Anaer",atyp:"Atyp"};
const ALLBUGS=GROUPS.flatMap(g=>g.bugs);
const BUGCOL={};GROUPS.forEach(g=>g.bugs.forEach(b=>BUGCOL[b]=g.col));

const DRUGS=[
 {id:"peng",n:"Penicillin G",c:"Penicillin",b:"strep",w:"The original. Too polar and too easily chewed by beta-lactamase to do much beyond strep. Staph almost all make penicillinase now, so MSSA is gone too.",r:["R2"]},
 {id:"fluclox",n:"Nafcillin / Oxacillin",c:"Anti-staph penicillin (UK: flucloxacillin)",b:"mssa strep",w:"A bulky side chain shields the beta-lactam ring from staph penicillinase, so MSSA comes back. Still a penicillin, so PBP2a means no MRSA. Still can't get through the Gram −ve outer membrane.",r:["R1","R2"]},
 {id:"amox",n:"Ampicillin / Amoxicillin",c:"Aminopenicillin",b:"strep ecoli pmir nmen",w:"The amino group makes it more hydrophilic, so it gets through Gram −ve porins: E. coli and Proteus. Klebsiella has a chromosomal beta-lactamase (SHV-1), so it's intrinsically resistant. No staph (penicillinase). Neisseria meningitidis is still very penicillin-sensitive.",r:["R2","R7"]},
 {id:"cefaz",n:"Cefazolin / Cefalexin",c:"1st-gen cephalosporin",b:"mssa strep ecoli pmir kleb",w:"Gram +ves plus 'PEK': Proteus, E. coli, Klebsiella. That's essentially the skin flora plus easy coliforms, which is why cefazolin is the surgical prophylaxis drug.",r:["R9","R1"]},
 {id:"cefox",n:"Cefotetan / Cefoxitin",c:"2nd-gen (cephamycins)",b:"mssa strep ecoli pmir kleb anaer",w:"Same as 1st gen, plus anaerobes. The 7-α-methoxy group shields the ring from Bacteroides beta-lactamase. (UK's usual 2nd gen, cefuroxime, isn't a cephamycin and doesn't get anaerobes.)",r:["R6","R9"]},
 {id:"ceftri",n:"Ceftriaxone",c:"3rd-gen cephalosporin",b:"mssa strep ecoli pmir kleb escappm ngon nmen",w:"Moves right: adds Neisseria. That plus decent CSF penetration through inflamed meninges is why it's the meningitis and gonorrhoea drug. Misses Pseudomonas. The chart ticks ESCAPPM, but AmpC can be derepressed on treatment, so be wary in serious infection.",r:["R9","R10","R8"]},
 {id:"ceftaz",n:"Ceftazidime",c:"3rd-gen cephalosporin",b:"strep ecoli pmir kleb pseud",w:"The 3rd gen that traded staph for Pseudomonas. Weak on Gram +ves, so no MSSA. Shares its side chain with aztreonam (handy for allergy questions).",r:["R8","R9"]},
 {id:"cefep",n:"Cefepime",c:"4th-gen cephalosporin",b:"mssa strep ecoli pmir kleb pseud escappm ngon nmen",w:"Zwitterion, so it slips through porins fast and is a poor substrate for AmpC. Gets both sides: staph/strep and Pseudomonas/ESCAPPM. Still a beta-lactam, so no MRSA; no anaerobes, no atypicals.",r:["R9","R10","R8"]},
 {id:"coamox",n:"Amoxicillin + clavulanate",c:"Beta-lactamase inhibitor combo (Augmentin)",b:"mssa strep ecoli pmir kleb anaer",w:"Compare it with amoxicillin. The inhibitor gains you the three beta-lactamase makers: MSSA, Klebsiella, Bacteroides.",r:["R7","R6"]},
 {id:"unasyn",n:"Ampicillin + sulbactam",c:"Beta-lactamase inhibitor combo (Unasyn)",b:"mssa strep ecoli pmir kleb anaer",w:"Identical pattern to co-amoxiclav. Same logic: inhibitor unlocks staph, Kleb, anaerobes.",r:["R7","R6"]},
 {id:"piptaz",n:"Piperacillin + tazobactam",c:"Beta-lactamase inhibitor combo (UK: Tazocin)",b:"mssa strep ecoli pmir kleb pseud escappm nmen anaer",w:"Piperacillin is an anti-pseudomonal penicillin, so on top of the co-amox pattern it adds Pseudomonas. Broad Gram −ve plus anaerobes, which is why it's the go-to for sepsis of unknown source.",r:["R7","R8","R6"]},
 {id:"erta",n:"Ertapenem",c:"Carbapenem",b:"mssa strep ecoli pmir kleb escappm ngon nmen anaer",w:"Everything meropenem gets except Pseudomonas. Poor uptake through OprD and gets pumped out. Trap number one.",r:["R8","R6","R10"]},
 {id:"mero",n:"Imipenem / Meropenem",c:"Carbapenem",b:"mssa strep ecoli pmir kleb pseud escappm ngon nmen anaer",w:"Stable to almost all beta-lactamases, including AmpC and anaerobe ones. So everything except the two columns no beta-lactam can ever touch: MRSA (PBP2a) and atypicals (no wall).",r:["R1","R5","R6"]},
 {id:"aztreo",n:"Aztreonam",c:"Monobactam",b:"ecoli pmir kleb pseud escappm ngon nmen",w:"The mirror image of vancomycin. Binds PBP3 of Gram −ves only, so it has no grip on Gram +ve PBPs. Every Gram −ve column, nothing else.",r:["R2"]},
 {id:"cipro",n:"Ciprofloxacin",c:"Fluoroquinolone",b:"mssa ecoli pmir kleb pseud escappm ngon nmen",w:"Blocks DNA gyrase and topoisomerase IV. Bottom rung of the ladder. Great Gram −ve including Pseudomonas, weak on strep. Don't use it for pneumococcal pneumonia.",r:["R11","R8"]},
 {id:"levo",n:"Levofloxacin",c:"Fluoroquinolone",b:"mssa strep ecoli pmir kleb pseud escappm ngon nmen atyp",w:"Cipro plus strep plus atypicals. That's what makes it a 'respiratory quinolone'.",r:["R11","R5"]},
 {id:"moxi",n:"Moxifloxacin",c:"Fluoroquinolone",b:"mssa strep ecoli pmir kleb escappm ngon nmen anaer atyp",w:"Top rung: adds anaerobes, but drops Pseudomonas. Trap number two.",r:["R11","R8"]},
 {id:"amino",n:"Gentamicin / Tobramycin / Amikacin",c:"Aminoglycoside",b:"ecoli pmir kleb pseud escappm",w:"Aerobic Gram −ve bacilli only. Uptake needs the electron transport chain, so anaerobes and strep (fermenters) don't pull it in. Once inside it makes the 30S misread, the faulty proteins end up in the membrane and it leaks, which is why it's cidal.",r:["R3"]},
 {id:"clinda",n:"Clindamycin",c:"Lincosamide",b:"mrsa mssa strep anaer",w:"50S ribosome, so PBP2a is irrelevant and it gets MRSA. Excluded by the Gram −ve outer membrane, but anaerobes are fine. Gram +ves and 'above the diaphragm' anaerobes.",r:["R1","R2","R6"]},
 {id:"azith",n:"Azithromycin",c:"Macrolide",b:"mssa strep nmen atyp",w:"Plugs the 50S exit tunnel and concentrates inside cells, so it's an atypical drug. Big hydrophobic molecule, kept out of Enterobacterales by the outer membrane.",r:["R5","R2"]},
 {id:"doxy",n:"Doxycycline",c:"Tetracycline",b:"strep ecoli nmen atyp",w:"Ribosomal (30S), gets into cells, so atypicals. Proteus is intrinsically tetracycline-resistant (efflux). (In practice doxy also gets a lot of MRSA; this chart leaves it out.)",r:["R5"]},
 {id:"vanc",n:"Vancomycin",c:"Glycopeptide",b:"mrsa mssa strep",w:"Binds D-Ala-D-Ala on the peptidoglycan precursor, not the PBP, so mecA doesn't matter: MRSA covered. Huge molecule (~1450 Da) that can't fit through Gram −ve porins: Gram +ve only.",r:["R1","R2"]},
 {id:"tmp",n:"TMP/SMX (co-trimoxazole)",c:"Antimetabolite (folate)",b:"mrsa mssa strep ecoli pmir kleb escappm nmen",w:"Two blocks on folate synthesis. Bacteria have to make folate, we absorb ours, so it's selective. Nothing to do with the wall, so MRSA is in. Broad aerobic cover. Misses Pseudomonas (efflux) and anaerobes.",r:["R1"]},
 {id:"metro",n:"Metronidazole",c:"Nitroimidazole",b:"anaer",w:"A prodrug that has to be reduced to become a DNA-shredding radical. Only anaerobes have electron carriers at a low enough redox potential to do it. Anaerobes and nothing else.",r:["R4"]},
];
DRUGS.forEach(d=>d.set=new Set(d.b.split(" ")));

const CLASSES=[
 {k:"pen",n:"Penicillins",col:"#8d99ae",stem:"-cillin",
  why:"Named after the Penicillium mould Fleming found (penicillus is Latin for a little paintbrush, which is what the mould's spore heads look like under a microscope). Anything ending <span class='stem'>-cillin</span> is a penicillin.",
  tip:"Fluclox, amox, ampicillin, piperacillin, temocillin. All the same core, with different side chains bolted on, which is what changes the spectrum.",
  eg:"Penicillin G (benzylpenicillin), flucloxacillin, amoxicillin, piperacillin"},
 {k:"ceph",n:"Cephalosporins",col:"#4f8fe0",stem:"cef- / ceph-",
  why:"Named after Cephalosporium, a mould Giuseppe Brotzu found near a sewage outfall in Sardinia in 1945. So cefalexin is essentially ceph + alexin. Anything starting <span class='stem'>cef</span> or <span class='stem'>ceph</span> is a cephalosporin (the old spelling ceph- is still used in the US).",
  tip:"Rough generation clue: most <span class='stem'>ceft-</span> drugs are 3rd gen (ceftriaxone, ceftazidime). The exceptions are the new 5th gens, ceftaroline and ceftobiprole, the two that get MRSA. 4th gen is really just cefepime.",
  eg:"Cefalexin, cefazolin, cefuroxime, cefoxitin, ceftriaxone, ceftazidime, cefepime"},
 {k:"bli",n:"Beta-lactamase inhibitor combos",col:"#8b6fd6",stem:"-bactam / clav-",
  why:"The inhibitor partner is itself a beta-lactam that the enzyme grabs and gets stuck on (a suicide substrate). Hence <span class='stem'>-bactam</span>: sulbactam, tazobactam. Clavulanate is the odd one, named after Streptomyces clavuligerus.",
  tip:"So: a <span class='stem'>-cillin</span> plus a <span class='stem'>-bactam</span> or clavulanate = penicillin + inhibitor. Aztreonam is a monobactam, which sounds similar, but it ends <span class='stem'>-onam</span> and isn't an inhibitor.",
  eg:"Co-amoxiclav (Augmentin), ampicillin-sulbactam (Unasyn), piperacillin-tazobactam (Tazocin)"},
 {k:"carb",n:"Carbapenems",col:"#e07a5f",stem:"-penem",
  why:"Carba + penem. A penem is a penicillin-like ring, and carba means a carbon has replaced the sulfur in it. That swap (plus a double bond) is a big part of why carbapenems shrug off most beta-lactamases. Anything ending <span class='stem'>-penem</span>.",
  tip:"Ertapenem is the E for exception: no Pseudomonas.",
  eg:"Meropenem, imipenem, ertapenem"},
 {k:"mono",n:"Monobactams",col:"#e9b03b",stem:"-onam",
  why:"Mono-bactam: the beta-lactam ring on its own, with no second ring fused to it. Penicillins, cephs and carbapenems all have a partner ring. Because the shape is so different, there's very little cross-allergy with penicillins.",
  tip:"Only one you need: aztreonam. The exception: it shares a side chain with ceftazidime, so allergy can cross over there.",
  eg:"Aztreonam"},
 {k:"quin",n:"Fluoroquinolones",col:"#4fae73",stem:"-floxacin",
  why:"Fluoro-quinolone: a quinolone core with a fluorine stuck on at position 6. That fluorine is essentially what made them good, improving gyrase binding and cell penetration. The <span class='stem'>-floxacin</span> ending literally carries the 'flo' for fluorine.",
  tip:"Cipro, levo, moxi, oflox. Ladder of spectrum in the Rules tab.",
  eg:"Ciprofloxacin, levofloxacin, moxifloxacin, ofloxacin"},
 {k:"amg",n:"Aminoglycosides",col:"#ef8a3c",stem:"-mycin / -micin",
  why:"Amino sugars joined by glycosidic bonds, hence amino-glycoside. The spelling tells you which soil bug made it: <span class='stem'>-mycin</span> came from Streptomyces (streptomycin, tobramycin, neomycin), <span class='stem'>-micin</span> from Micromonospora (gentamicin). Amikacin was made in the lab from kanamycin.",
  tip:"Gent, tobra, amikacin: learn those three as a set.",
  eg:"Gentamicin, tobramycin, amikacin, streptomycin, neomycin"},
 {k:"linc",n:"Lincosamides",col:"#2bb3ad",stem:"lin- / clinda-",
  why:"From lincomycin, made by Streptomyces lincolnensis, found in soil near Lincoln, Nebraska. Clindamycin is essentially chlorinated lincomycin: C(h)l + lin + da.",
  tip:"Basically only clindamycin.",
  eg:"Clindamycin, lincomycin"},
 {k:"mac",n:"Macrolides",col:"#c9a227",stem:"-thromycin",
  why:"Macro-lide: a big (macro) lactone ring, 14 or 15 atoms. That size is part of why they can't get through Gram −ve porins (Rules tab). Ending <span class='stem'>-thromycin</span> comes from the first one, erythromycin (erythro = red, after Streptomyces erythreus).",
  tip:"Erythro, clarithro, azithro. All end in <span class='stem'>-thromycin</span>.",
  eg:"Azithromycin, clarithromycin, erythromycin"},
 {k:"tet",n:"Tetracyclines",col:"#e0668b",stem:"-cycline",

const MOA={
 pen:["Wall","Binds PBPs covalently and stops the transpeptidase cross-linking the wall. Cidal. Methicillin was the first penicillinase-resistant one, which is where the M in MRSA comes from (flucloxacillin is its modern relative)."],
 ceph:["Wall","Same as penicillins: covalent PBP binding, no cross-links, the cell bursts. Cidal."],
 bli:["Wall","The penicillin does the killing. The inhibitor is a decoy beta-lactam that the beta-lactamase grabs and can't let go of."],
 carb:["Wall","PBP binding like the rest. Mostly IV only (not orally active), and kept as a last resort to protect them."],
 mono:["Wall","Binds PBP3, which only Gram −ves use to build their wall."],
 quin:["DNA","Blocks DNA gyrase (mostly in Gram −ves) and topoisomerase IV (mostly in Gram +ves), the enzymes that cut and re-join DNA to manage supercoiling. Ours are different enough to be spared. Cidal."],
 amg:["30S","Binds the A site on the 16S rRNA of the 30S subunit and makes it misread codons. The faulty proteins get built into the membrane and make it leak, which is why these are cidal when most ribosome drugs are static. Streptomycin, the first one, is now basically a TB drug."],
 linc:["50S","Binds the 50S subunit. Static. It also switches off toxin production, which is why it's added in necrotising fasciitis and toxic shock."],
 mac:["50S","Plugs the exit tunnel the new protein leaves the 50S by. Newer structural work suggests it only stalls some proteins, depending on their sequence. Clarithromycin is also the macrolide for H. pylori and Mycobacterium avium."],
 tet:["30S","Binds the 30S subunit reversibly and stops the aminoacyl-tRNA landing in the A site. Static. Classic uses: rickettsia, chlamydia, Lyme, acne."],
 glyc:["Wall","Hydrogen-bonds to the D-Ala-D-Ala end of the wall building block, so it can't be slotted in. It sits on the substrate, so PBP2a doesn't matter."],
 anti:["Folate","Bacteria have to make their own folate because they can't take it up. We absorb ours from food. Sulfamethoxazole copies PABA and blocks DHPS. Trimethoprim copies the pteridine part of folate and blocks DHFR. Two steps of one pathway, so they're synergistic, and they were paired because their pKs match."],
 nitro:["DNA","Reduced inside anaerobes to a radical that breaks up DNA. Cidal."],
};

const RULES=[
 {id:"R1",t:"MRSA column: no beta-lactams, ever",tags:["mrsa"],
  p:["MRSA carries mecA, which codes for PBP2a. Essentially a spare penicillin-binding protein that beta-lactams can't grip. So every penicillin, cephalosporin and carbapenem on this chart misses it, however broad.",
     "What's left must hit something other than PBPs: vancomycin (binds the peptidoglycan building block), clindamycin (ribosome), co-trimoxazole (folate). That's the whole column.",
     "Exception off-chart: ceftaroline, the '5th gen' ceph, was designed to bind PBP2a."]},
 {id:"R2",t:"The Gram −ve outer membrane is the gate",tags:["gp","gn"],svg:true,
  p:["Gram −ves have an extra outer membrane. Drugs get in through porins, which are small water-filled channels. So the question is always: is it small and hydrophilic enough to fit?",
     "Vancomycin is massive, so it's stuck outside. Gram +ve only. Macrolides and clindamycin are big and greasy, so the same. Adding an amino group to penicillin (ampicillin) made it hydrophilic enough to get into E. coli and Proteus.",
     "Aztreonam is the mirror image. It only binds PBP3 of Gram −ves, so it has nothing to grab in Gram +ves. Look at its bar: it starts exactly where the Gram −ves start."]},
 {id:"R3",t:"Aminoglycosides need oxygen",tags:["gn"],
  p:["Aminoglycosides are pulled across the inner membrane by the proton motive force from aerobic respiration. No electron transport chain, no uptake.",
     "Anaerobes have no respiratory chain. Streptococci are fermenters, so same problem. That's why the bar is exactly the five Gram −ve bacilli.",
     "It's also why gent is given with a beta-lactam for strep/enterococcal endocarditis. The beta-lactam damages the wall and the aminoglycoside gets in that way (synergy)."]},
 {id:"R4",t:"Metronidazole only works where there's no oxygen",tags:["an"],
  p:["Nothing to do with the cell wall. It's redox chemistry. Metronidazole is a prodrug, and its nitro group has to be reduced to form a toxic radical that breaks DNA.",
     "Only anaerobes have electron carriers (ferredoxin, fed by the enzyme PFOR) with a low enough redox potential to do that reduction. In an aerobe, oxygen just takes the electron straight back off, so the drug never activates.",
     "Hence one tiny bar on the chart. Same trick works on anaerobic protozoa: Giardia, Trichomonas, Entamoeba."]},
 {id:"R5",t:"Atypicals have no wall to hit",tags:["at"],
  p:["Mycoplasma has no cell wall at all. Chlamydia and Legionella hide inside your cells. So every wall drug (all the beta-lactams, vancomycin) is useless, which wipes out most of the chart in one go.",
     "You need drugs that hit the ribosome or DNA and concentrate inside cells: Macrolides, Tetracyclines, Quinolones (the respiratory ones, levo and moxi). Those are the only four bars in the column."]},
 {id:"R6",t:"Anaerobes make beta-lactamase",tags:["an"],
  p:["Bacteroides fragilis, the main gut anaerobe, makes a beta-lactamase. So a beta-lactam only covers anaerobes if it's protected.",
     "Protected means: a beta-lactamase inhibitor (co-amox, amp-sulb, pip-tazo), a carbapenem (stable to it), or a cephamycin (cefoxitin/cefotetan, whose 7-α-methoxy group shields the ring). Ceftriaxone and cefepime aren't protected, so no anaerobes.",
     "Non-beta-lactams in the column: metronidazole, clindamycin, moxifloxacin. Rough clinical rule: below the diaphragm (gut, abscess, aspiration) think anaerobes."]},
 {id:"R7",t:"An inhibitor unlocks three columns",tags:["gp","gn","an"],
  p:["Compare amoxicillin with co-amoxiclav. Clavulanate adds exactly three: MSSA (staph penicillinase), Klebsiella (chromosomal SHV-1, which is why Kleb is intrinsically amp-resistant) and anaerobes (Bacteroides beta-lactamase).",
     "So you don't learn the combo bars separately. Learn the parent penicillin, then add 'Staph, Kleb, Bacteroides'. Pip-tazo is the same, just starting from an anti-pseudomonal penicillin."]},
 {id:"R8",t:"The Pseudomonas club",tags:["gn"],
  p:["Pseudomonas has a tight outer membrane with few porins (OprD), efflux pumps and its own AmpC. Very little gets in.",
     "The members: ceftazidime, cefepime, pip-tazo, meropenem/imipenem, aztreonam, cipro, levo, aminoglycosides.",
     "The traps are the convenient broad ones: ceftriaxone, ertapenem and moxifloxacin all skip Pseudomonas. Each looks broad on the chart, and each has a gap in the same column."]},
 {id:"R9",t:"Cephalosporins move right with each generation",tags:["gp","gn"],
  p:["1st gen: Gram +ves plus 'PEK' (Proteus, E. coli, Klebsiella). Each generation is more stable to Gram −ve beta-lactamases and better at porins, so the bars slide right.",
     "3rd gen picks up Neisseria (ceftriaxone, which also gets into CSF when the meninges are inflamed, so meningitis). Ceftazidime trades its Gram +ve cover for Pseudomonas. 4th gen cefepime gets both sides.",
     "Two things no cephalosporin here covers: MRSA (R1) and enterococci, which this chart leaves out but which are intrinsically ceph-resistant."]},
 {id:"R10",t:"ESCAPPM means AmpC",tags:["gn"],
  p:["Enterobacter, Serratia, Citrobacter freundii, Aeromonas, Proteus (vulgaris), Providencia, Morganella. Their shared feature is a chromosomal, inducible AmpC beta-lactamase.",
     "AmpC destroys ampicillin, 1st and 2nd gen cephs and co-amoxiclav (clavulanate doesn't inhibit it). Reliable: cefepime, carbapenems, quinolones, aminoglycosides, co-trimoxazole.",
     "The chart ticks ceftriaxone and pip-tazo too, but mutants that pump out AmpC constantly can be selected during treatment, so many guidelines avoid them in serious infection."]},
 {id:"R11",t:"The quinolone ladder",tags:["gn","gp","at"],
  p:["Cipro: Gram −ves including Pseudomonas, weak strep. Levo: adds strep and atypicals. Moxi: adds anaerobes, loses Pseudomonas.",
     "Each step up gains Gram +ve/anaerobe cover and gives away a bit of Gram −ve power. Think of it as a seesaw."]},
 {id:"R12",t:"Wall drugs kill, ribosome drugs mostly stall",tags:["gp","gn"],wall:true,
  p:["The wall holds back a lot of pressure: about 20 atmospheres inside a Gram +ve, about 5 in a Gram −ve. Weaken it and the cell bursts. So wall drugs (beta-lactams, vancomycin) are bactericidal.",
     "Ribosome drugs (macrolides, tetracyclines, clindamycin, linezolid) are mostly bacteriostatic. Bacteria are used to starving, so they just wait it out, and your immune system finishes the job.",
     "The exception is aminoglycosides. Misreading puts faulty proteins into the membrane, it leaks, and the cell dies. Quinolones, rifampicin and metronidazole are cidal too, because breaking DNA or RNA isn't something you can wait out."]},
 {id:"R13",t:"Why the drugs spare us",tags:["gp","gn"],
  p:["Every good target is something bacteria have and we don't, or have in a different form. Peptidoglycan: we have none. Ribosomes: theirs are 70S (50S + 30S), ours are 80S (60S + 40S). Folate: they must make it, we absorb it. DNA gyrase and RNA polymerase: different enough from ours.",
     "Energy metabolism (glycolysis and so on) is a poor target. It's too like ours, and bacteria can just switch to another fuel.",
     "The same logic runs through the other microbes. Fungi use ergosterol where we use cholesterol (azoles, amphotericin, terbinafine). Herpes brings its own thymidine kinase (aciclovir). HIV brings reverse transcriptase, protease and integrase."]},
];

function pickWeighted(items,key){
  const w=items.map(i=>1+3*(S.weak[key(i)]||0));
  let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;
  for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}
  return items[items.length-1];
}
function record(key,perfect){
  S.total++;
  if(perfect){S.right++;S.streak++;S.weak[key]=Math.max(0,(S.weak[key]||0)-1)}
  else{S.streak=0;S.weak[key]=Math.min(4,(S.weak[key]||0)+2)}
  save();scoreLine();
}

function drugQ(){

      b.dataset.k=c.k;
      b.onclick=()=>{if(done)return;done=true;const ok=c.k===right.k;record("c:"+it[0],ok);
        b.classList.add(ok?"ok":"bad");if(!ok)o.querySelector(`[data-k="${right.k}"]`).classList.add("ok");
        const w=card.querySelector("#w");w.style.display="block";
        w.innerHTML=`<b>${ok?"Yes.":"It's "+right.n.toLowerCase()+"."} Look for <span class="stem">${right.stem}</span></b>${right.why}${right.moa?`<div style="margin-top:6px"><span class="stem">${right.hit}</span> ${right.moa}</div>`:""}`;
        card.querySelector("#nx").style.display="flex"};
      o.appendChild(b)});
    card.querySelector("#nx button").onclick=()=>{card.replaceWith(q());window.scrollTo(0,0)};
    return card;
  }
  main.appendChild(q());
  main.appendChild(el(`<div class="card"><div class="q-label">The big split</div>
    <p style="margin:6px 0;font-size:15px;line-height:1.5">The first five classes are all beta-lactams. They share one four-membered ring, and what's fused onto it tells you the family. Everything else on the chart hits something other than the wall.</p>${lactamSVG()}
    <p class="note">The <span class="stem">-mycin</span> trap: it only tells you the drug came from a soil Streptomyces, so it turns up in four classes. <span class="stem">-thromycin</span> is a macrolide, clinda/linco is a lincosamide, vanco is a glycopeptide, and the rest (strepto, neo, tobra, genta-<i>micin</i>) are aminoglycosides.</p>
    <p class="note">The <span class="stem">-azole</span> trap: metro<b>nidazole</b> is antibacterial, the <b>-conazole</b>s are antifungal, and line<b>zolid</b> is antibacterial again.</p></div>`));
  ["chart","abx","virus","fungus","protozoa"].filter(inScope).forEach(g=>{
    main.appendChild(el(`<div class="clhead" style="margin:18px 2px 8px"><span class="dot" style="background:var(--ink)"></span>${GRPNAME[g]}</div>`));
    CLASSES.filter(c=>c.grp===g).forEach(c=>main.appendChild(el(`<div class="cls-card" style="--cc:${c.col}"><h3>${c.n} <span class="stem">${c.stem}</span></h3><p>${c.why}</p>${c.moa?`<p><span class="stem" style="background:${c.col};color:#fff;border-color:${c.col}">${c.hit}</span> ${c.moa}</p>`:""}${c.tip?`<p>${c.tip}</p>`:""}<p class="eg">${c.eg}</p></div>`)));
  });
}

function lactamSVG(){
  const ink="var(--ink)",mut="var(--mut)";
  const sq=(x,y,c)=>`<rect x="${x}" y="${y}" width="30" height="30" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width="2"/><text x="${x+15}" y="${y+19}" text-anchor="middle" font-size="9" fill="${ink}">β-L</text>`;
  const pent=(x,y,c,lab)=>`<polygon points="${x},${y} ${x+26},${y-6} ${x+38},${y+15} ${x+26},${y+36} ${x},${y+30}" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="2"/><text x="${x+20}" y="${y+19}" text-anchor="middle" font-size="10" font-weight="700" fill="${ink}">${lab}</text>`;
  const hex=(x,y,c,lab)=>`<polygon points="${x},${y} ${x+20},${y-10} ${x+40},${y} ${x+40},${y+30} ${x+20},${y+40} ${x},${y+30}" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="2"/><text x="${x+20}" y="${y+19}" text-anchor="middle" font-size="10" font-weight="700" fill="${ink}">${lab}</text>`;
  const cap=(x,t1,t2)=>`<text x="${x}" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="${ink}">${t1}</text><text x="${x}" y="112" text-anchor="middle" font-size="9.5" fill="${mut}">${t2}</text>`;
  return `<svg viewBox="0 0 360 120" width="100%" style="max-width:480px;display:block;margin:6px 0 8px">
   ${sq(10,30,CLS.pen.col)}${pent(40,30,CLS.pen.col,"S")}${cap(42,"Penicillin","+ 5-ring with S")}
   ${sq(100,30,CLS.ceph.col)}${hex(130,30,CLS.ceph.col,"S")}${cap(135,"Cephalosporin","+ 6-ring with S")}
   ${sq(195,30,CLS.carb.col)}${pent(225,30,CLS.carb.col,"C")}${cap(228,"Carbapenem","S swapped for C")}
   ${sq(300,30,CLS.mono.col)}${cap(315,"Monobactam","ring on its own")}
  </svg>`;
}

render();
if('serviceWorker' in navigator){let _r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_r)return;_r=true;location.reload()});window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}
</script>
